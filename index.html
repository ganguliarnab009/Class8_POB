<body class="text-gray-800 antialiased overflow-x-hidden">

        <!-- STUDENT DASHBOARD -->
        <div id="view-student" class="hidden flex-1 flex flex-col md:flex-row h-screen">

                <button onclick="toggleSidebar('admin-sidebar')" class="text-white text-2xl px-2"><i class="fa-solid fa-bars"></i></button>

                <div class="p-5 border-b border-gray-700 hidden md:block shrink-0">

                    <button onclick="toggleSidebar('admin-sidebar')" class="text-xl text-gray-400 px-2"><i class="fa-solid fa-times"></i></button>
                </div>
                
                <div class="flex-1 overflow-y-auto py-4 hide-scrollbar">
                    <nav id="admin-nav" class="space-y-1">
                        <button onclick="switchAdminTab('students')" class="admin-tab w-full text-left px-5 py-3 hover:bg-gray-700 font-semibold border-l-4 border-transparent transition"><i class="fa-solid fa-users w-6 text-center"></i> ছাত্রছাত্রী</button>
                        <button onclick="switchAdminTab('logs')" class="admin-tab w-full text-left px-5 py-3 hover:bg-gray-700 font-semibold border-l-4 border-transparent transition"><i class="fa-solid fa-history w-6 text-center"></i> লগিন হিস্ট্রি</button>
                        <button onclick="switchAdminTab('materials')" class="admin-tab w-full text-left px-5 py-3 hover:bg-gray-700 font-semibold border-l-4 border-transparent transition"><i class="fa-solid fa-book w-6 text-center text-emerald-400"></i> স্টাডি মেটেরিয়াল</button>
                        <button onclick="switchAdminTab('videos')" class="admin-tab w-full text-left px-5 py-3 hover:bg-gray-700 font-semibold border-l-4 border-transparent transition"><i class="fa-brands fa-youtube w-6 text-center text-red-400"></i> ভিডিও ক্লাস</button>

    <!-- MAIN JAVASCRIPT LOGIC -->
    <script>
        // ==========================================
        // 1. CONFIGURATION & STATE
        // ==========================================
        
        // Google Apps Script Web App URL
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwsoROMQbsnr1SsQ1GxfFYq7Ie5JZS9eXdMTzMhL-0qU2JR-PvdkiDw8YAA0kg8A7_oDA/exec"; 

        // অষ্টম শ্রেণীর সিলেবাস (পর্যায়ক্রমিক অনুযায়ী ভাগ করা)
        const CHAPTERS = [
            // প্রথম পর্যায়ক্রমিক
            { name: "১.১ বল ও চাপ", phase: "প্রথম" },
            { name: "১.২ স্পর্শ ছাড়া ক্রিয়াশীল বল", phase: "প্রথম" },
            { name: "২.১ পদার্থের প্রকৃতি", phase: "প্রথম" },
            { name: "২.২ পদার্থের গঠন", phase: "প্রথম" },
            { name: "৩. দেহের গঠন", phase: "প্রথম" },
            // দ্বিতীয় পর্যায়ক্রমিক
            { name: "১.৩ তাপ", phase: "দ্বিতীয়" },
            { name: "২.৩ রাসায়নিক বিক্রিয়া", phase: "দ্বিতীয়" },
            { name: "২.৪ তড়িতের রাসায়নিক প্রভাব", phase: "দ্বিতীয়" },
            { name: "৫. প্রাকৃতিক ঘটনা ও তার বিশ্লেষণ", phase: "দ্বিতীয়" },
            { name: "৮. মানুষের খাদ্য ও খাদ্য উৎপাদন", phase: "দ্বিতীয়" },
            // তৃতীয় পর্যায়ক্রমিক
            { name: "১.৪ আলো", phase: "তৃতীয়" },
            { name: "৩. কয়েকটি গ্যাসের পরিচিতি", phase: "তৃতীয়" },
            { name: "৪. কার্বন ও কার্বনঘটিত যৌগ", phase: "তৃতীয়" },
            { name: "৭. অণুজীবের জগৎ", phase: "তৃতীয়" },
            { name: "৯. অন্তঃক্ষরা গ্রন্থি ও বয়ঃসন্ধি", phase: "তৃতীয়" },
            { name: "১০. পরিবেশের সংকট ও সংরক্ষণ", phase: "তৃতীয়" },
            { name: "১১. আমাদের চারপাশের পরিবেশ ও উদ্ভিদ জগৎ", phase: "তৃতীয়" }
        ];

        let state = {
            currentUser: null,
            view: 'login',
            data: { materials: [], videos: [], mockTests: [], practiceTests: [], students: [], logs: [] },
            currentChapter: null,
            studentTab: 'notes',
            score: 0
        };

        // ==========================================
        // 2. UTILITY FUNCTIONS
        // ==========================================

        function showSpinner(show) {
            document.getElementById('loader').style.display = show ? 'flex' : 'none';
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const color = type === 'success' ? 'bg-green-500' : (type === 'error' ? 'bg-red-500' : 'bg-blue-500');
            toast.className = `${color} text-white px-4 py-3 rounded-lg shadow-lg transform transition-all duration-300 translate-x-full flex items-center gap-2`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}"></i> ${message}`;
            
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-x-full'), 10);
            setTimeout(() => {
                toast.classList.add('translate-x-full');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function toBengaliNum(num) {
            const digits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
            return num.toString().split('').map(d => digits[d] || d).join('');
        }

        function toggleSidebar(id) {
            const sidebar = document.getElementById(id);
            sidebar.classList.toggle('-translate-x-full');
        }

        // ==========================================
        // 3. API & DATA MANAGEMENT
        // ==========================================

        async function fetchAPI(action = 'get', payload = null) {
            if(GAS_URL === "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE"){
                return handleLocalAPI(action, payload);
            }

            try {
                if (action === 'get') {
                    const res = await fetch(GAS_URL);
                    const json = await res.json();
                    if(json.status === 'success') {
                        state.data = json.data;
                        localStorage.setItem('ls_data', JSON.stringify(state.data));
                        return true;
                    }
                } else {
                    const res = await fetch(GAS_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action, data: payload })
                    });
                    const json = await res.json();
                    return json.status === 'success';
                }
            } catch (err) {
                console.error("API Error:", err);
                return handleLocalAPI(action, payload);
            }
        }

        function handleLocalAPI(action, payload) {
            const local = JSON.parse(localStorage.getItem('ls_data')) || { materials: [], videos: [], mockTests: [], practiceTests: [], students: [], logs: [] };
            
            if (action === 'get') {
                state.data = local;
                return true;
            } else {
                let key = action.replace('add_', '') + 's';
                if(key === 'student_logs') key = 'logs'; 
                if(local[key]) local[key].push(payload);
                state.data = local;
                localStorage.setItem('ls_data', JSON.stringify(local));
                return true;
            }
        }

        async function initData() {
            showSpinner(true);
            await fetchAPI('get');
            showSpinner(false);
        }

        // ==========================================
        // 4. AUTHENTICATION
        // ==========================================

        function toggleAuthTab(type) {
            document.getElementById('form-student-login').classList.toggle('hidden', type !== 'student');
            document.getElementById('form-admin-login').classList.toggle('hidden', type !== 'admin');
            
            const stdTab = document.getElementById('tab-login-student');
            const admTab = document.getElementById('tab-login-admin');
            
            if(type === 'student') {
                stdTab.className = "flex-1 py-3 font-semibold bg-gray-50 text-primary border-b-2 border-primary transition";
                admTab.className = "flex-1 py-3 font-semibold text-gray-500 hover:bg-gray-50 transition";
            } else {
                admTab.className = "flex-1 py-3 font-semibold bg-gray-50 text-primary border-b-2 border-primary transition";
                stdTab.className = "flex-1 py-3 font-semibold text-gray-500 hover:bg-gray-50 transition";
            }
        }

        async function handleStudentLogin(e) {
            e.preventDefault();
            const student = {
                name: document.getElementById('std-name').value.trim(),
                roll: document.getElementById('std-roll').value.trim(),
                section: document.getElementById('std-sec').value.trim().toUpperCase(),
                class: document.getElementById('std-class').value,
                school: document.getElementById('std-school').value.trim()
            };

            showSpinner(true);
            await initData(); 

            const exists = state.data.students.find(s => s.roll == student.roll && s.name === student.name);
            if (!exists) {
                await fetchAPI('add_student', student);
            }

            const log = {
                date: new Date().toLocaleString('en-IN'),
                name: student.name,
                roll: student.roll,
                classSec: `${student.class} - ${student.section}`
            };
            await fetchAPI('add_log', log);

            localStorage.setItem('auth_user', JSON.stringify({ type: 'student', data: student }));
            state.currentUser = student;
            showToast(`স্বাগতম, ${student.name}!`);
            showSpinner(false);
            initApp();
        }

        function handleAdminLogin(e) {
            e.preventDefault();
            const id = document.getElementById('admin-id').value;
            const pwd = document.getElementById('admin-pwd').value;

            if (id === 'admin' && pwd === '1234') {
                localStorage.setItem('auth_user', JSON.stringify({ type: 'admin' }));
                state.currentUser = 'admin';
                showToast('অ্যাডমিন লগইন সফল!');
                initApp();
            } else {
                showToast('ভুল আইডি বা পাসওয়ার্ড!', 'error');
            }
        }

        function logout() {
            localStorage.removeItem('auth_user');
            state.currentUser = null;
            initApp();
        }

        // ==========================================
        // 5. ROUTING & INITIALIZATION
        // ==========================================

        async function initApp() {
            const authStr = localStorage.getItem('auth_user');
            if (authStr) {
                const auth = JSON.parse(authStr);
                if (auth.type === 'admin') {
                    state.currentUser = 'admin';
                    document.getElementById('view-login').classList.add('hidden');
                    document.getElementById('view-student').classList.add('hidden');
                    document.getElementById('view-admin').classList.remove('hidden');
                    await initData();
                    switchAdminTab('students');
                } else {
                    state.currentUser = auth.data;
                    document.getElementById('view-login').classList.add('hidden');
                    document.getElementById('view-admin').classList.add('hidden');
                    document.getElementById('view-student').classList.remove('hidden');
                    document.getElementById('std-user-name').innerText = auth.data.name;
                    await initData();
                    renderStudentSidebar();
                    loadStudentView('home');
                }
            } else {
                document.getElementById('view-student').classList.add('hidden');
                document.getElementById('view-admin').classList.add('hidden');
                document.getElementById('view-login').classList.remove('hidden');
            }
        }

        // ==========================================
        // 6. STUDENT DASHBOARD LOGIC
        // ==========================================

        function renderStudentSidebar() {
            const list = document.getElementById('std-chapter-list');
            const phases = ['প্রথম', 'দ্বিতীয়', 'তৃতীয়'];

            let html = `
                <button onclick="loadStudentView('home')" id="nav-home-btn" class="std-nav-btn w-full text-left px-5 py-3 mb-2 font-bold border-l-4 transition flex items-center gap-3 text-sm border-transparent text-gray-700 hover:bg-emerald-50 hover:text-primary">
                    <i class="fa-solid fa-house-chimney text-lg w-5 text-center"></i> হোম (সিলেবাস)
                </button>
            `;

            phases.forEach((phaseStr, pIdx) => {
                let icon = pIdx === 0 ? 'fa-book-open text-blue-500' : (pIdx === 1 ? 'fa-book-open-reader text-green-500' : 'fa-graduation-cap text-purple-500');
                
                html += `
                <div class="border-b border-gray-100 last:border-0">
                    <button onclick="toggleSidebarAccordion('sidebar-phase-${pIdx}')" class="w-full flex justify-between items-center px-5 py-3 hover:bg-gray-50 transition text-sm font-semibold text-gray-800">
                        <span class="flex items-center gap-2"><i class="fa-solid ${icon} w-5 text-center"></i> ${phaseStr} পর্যায়ক্রমিক</span>
                        <i class="fa-solid fa-chevron-down text-gray-400 transition-transform duration-300 text-xs" id="icon-sidebar-phase-${pIdx}"></i>
                    </button>
                    <div id="sidebar-phase-${pIdx}" class="max-h-0 overflow-hidden transition-all duration-300 bg-gray-50/50">
                        <div class="py-1">
                `;

                CHAPTERS.forEach((ch, idx) => {
                    if (ch.phase === phaseStr) {
                        html += `
                        <button onclick="loadStudentView('chapter', ${idx})" class="std-nav-btn w-full text-left pl-11 pr-4 py-2 hover:bg-emerald-50 text-gray-600 hover:text-primary font-medium border-l-4 border-transparent hover:border-primary transition flex items-center gap-3 text-[13px]" data-idx="${idx}">
                            <div class="w-5 h-5 rounded-full bg-emerald-100 text-primary flex items-center justify-center font-bold text-[10px] shrink-0 shadow-sm border border-emerald-100"><i class="fa-solid fa-angle-right"></i></div>
                            <span class="line-clamp-2">${ch.name}</span>
                        </button>
                        `;
                    }
                });

                html += `
                        </div>
                    </div>
                </div>
                `;
            });
            list.innerHTML = html;

            setTimeout(() => toggleSidebarAccordion('sidebar-phase-0'), 100);
        }

        function toggleSidebarAccordion(id) {
            const content = document.getElementById(id);
            const icon = document.getElementById('icon-' + id);
            if(!content || !icon) return;
            
            if (content.style.maxHeight && content.style.maxHeight !== '0px') {
                content.style.maxHeight = '0px';
                icon.style.transform = 'rotate(0deg)';
            } else {
                content.style.maxHeight = content.scrollHeight + 'px';
                icon.style.transform = 'rotate(180deg)';
            }
        }

        function loadStudentView(type, index = null) {
            const main = document.getElementById('std-main-content');
            
            document.querySelectorAll('.std-nav-btn').forEach(btn => {
                btn.classList.remove('bg-emerald-50', 'border-primary', 'text-primary');
                btn.classList.add('border-transparent', 'text-gray-700');
            });

            if (type === 'home') {
                state.currentChapter = null;
                const homeBtn = document.getElementById('nav-home-btn');
                if(homeBtn) {
                    homeBtn.classList.remove('border-transparent', 'text-gray-700');
                    homeBtn.classList.add('bg-emerald-50', 'border-primary', 'text-primary');
                }
                renderHomeView(main);
            } else if (type === 'mock') {
                state.currentChapter = null;
                renderMockTests(main);
            } else if (type === 'chapter') {
                state.currentChapter = index;
                const activeBtn = document.querySelector(`.std-nav-btn[data-idx="${index}"]`);
                if(activeBtn) {
                    activeBtn.classList.remove('border-transparent', 'text-gray-700');
                    activeBtn.classList.add('bg-emerald-50', 'border-primary', 'text-primary');
                }
                renderChapterContent(main, index);
            }

            if (window.innerWidth < 768) {
                document.getElementById('std-sidebar').classList.add('-translate-x-full');
            }
        }

        function renderHomeView(container) {
            container.innerHTML = `
                <div class="max-w-4xl mx-auto mt-10">
                    <div class="bg-white rounded-xl shadow-sm p-10 text-center border-t-4 border-primary">
                        <i class="fa-solid fa-flask text-6xl text-emerald-500 mb-6 drop-shadow-md"></i>
                        <h2 class="text-3xl font-bold text-gray-800 mb-4">স্বাগতম, ${state.currentUser?.name || 'শিক্ষার্থী'}!</h2>
                        <p class="text-gray-600 text-lg">বাঁদিকের মেনু থেকে তোমার প্রয়োজনীয় পর্যায়ক্রমিক মূল্যায়ন ও অধ্যায় নির্বাচন করো।</p>
                    </div>
                </div>
            `;
        }

        function renderMockTests(container) {
            const tests = state.data.mockTests || [];
            let html = `
                <div class="max-w-4xl mx-auto">
                    <h2 class="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2"><i class="fa-solid fa-laptop-file text-blue-500"></i> মক টেস্ট সমূহ</h2>
            `;

            if (tests.length === 0) {
                html += `<div class="bg-white p-8 rounded-xl shadow-sm text-center text-gray-500 border border-gray-100">বর্তমানে কোনো মক টেস্ট উপলব্ধ নেই।</div>`;
            } else {
                html += `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;
                tests.forEach((t, i) => {
                    html += `
                        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition">
                            <div class="flex items-start gap-4">
                                <div class="bg-blue-100 text-blue-600 w-12 h-12 rounded-lg flex items-center justify-center text-xl shrink-0"><i class="fa-solid fa-file-signature"></i></div>
                                <div>
                                    <h3 class="font-bold text-gray-800 mb-2">${t.title}</h3>
                                    <button onclick="openExternalTest('${t.link}')" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold transition shadow-sm">
                                        Test Start করুন <i class="fa-solid fa-arrow-up-right-from-square ml-1 text-xs"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            html += `</div>`;
            container.innerHTML = html;
        }

        function openExternalTest(url) {
            showToast('এই টেস্টটি একটি বাইরের লিংকে খুলবে।', 'info');
            window.open(url, '_blank');
        }

        function renderChapterContent(container, chapterIndex) {
            const chName = CHAPTERS[chapterIndex].name;
            state.studentTab = state.studentTab || 'notes';
            state.score = 0; 

            let html = `
                <div class="max-w-4xl mx-auto">
                    <div class="bg-white rounded-xl shadow-sm p-6 mb-6 border-l-4 border-primary">
                        <span class="text-xs font-bold text-emerald-600 bg-emerald-100 px-3 py-1 rounded-full mb-2 inline-block">${CHAPTERS[chapterIndex].phase} পর্যায়ক্রমিক</span>
                        <h2 class="text-xl md:text-2xl font-bold text-gray-800 mt-2">${chName}</h2>
                    </div>

                    <!-- Tabs -->
                    <div class="flex gap-2 border-b mb-6 overflow-x-auto pb-1 hide-scrollbar">
                        <button onclick="switchChapterTab('notes')" class="tab-btn whitespace-nowrap px-4 py-2 font-semibold ${state.studentTab === 'notes' ? 'active' : 'text-gray-500 hover:text-gray-800'}"><i class="fa-solid fa-book-open mr-2"></i>স্টাডি নোটস</button>
                        <button onclick="switchChapterTab('qbank')" class="tab-btn whitespace-nowrap px-4 py-2 font-semibold ${state.studentTab === 'qbank' ? 'active' : 'text-gray-500 hover:text-gray-800'}"><i class="fa-solid fa-layer-group mr-2"></i>প্রশ্ন সংকলন</button>
                        <button onclick="switchChapterTab('videos')" class="tab-btn whitespace-nowrap px-4 py-2 font-semibold ${state.studentTab === 'videos' ? 'active' : 'text-gray-500 hover:text-gray-800'}"><i class="fa-brands fa-youtube text-red-500 mr-2"></i>ভিডিও ক্লাস</button>
                        <button onclick="switchChapterTab('mcq')" class="tab-btn whitespace-nowrap px-4 py-2 font-semibold ${state.studentTab === 'mcq' ? 'active' : 'text-gray-500 hover:text-gray-800'}"><i class="fa-solid fa-brain text-purple-500 mr-2"></i>প্র্যাকটিস MCQ</button>
                    </div>
                    
                    <div id="tab-content-area"></div>
                </div>
            `;
            container.innerHTML = html;
            switchChapterTab(state.studentTab);
        }

        function switchChapterTab(tab) {
            state.studentTab = tab;
            const area = document.getElementById('tab-content-area');
            if(!area) return;
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = `tab-btn whitespace-nowrap px-4 py-2 font-semibold text-gray-500 hover:text-gray-800`;
                if(btn.innerHTML.includes(tab === 'notes' ? 'নোটস' : tab === 'qbank' ? 'সংকলন' : tab === 'videos' ? 'ভিডিও' : 'MCQ')) {
                    btn.classList.add('active', 'border-b-2', 'border-primary', 'text-primary');
                    btn.classList.remove('text-gray-500', 'hover:text-gray-800');
                }
            });

            const chName = CHAPTERS[state.currentChapter].name;

            if (tab === 'notes' || tab === 'qbank') {
                const targetType = tab === 'notes' ? 'Notes' : 'QuestionBank';
                const emptyMsg = tab === 'notes' ? 'নোটস' : 'প্রশ্ন সংকলন';
                
                const materials = (state.data.materials || []).filter(m => m.chapter === chName && m.type === targetType);
                
                if(materials.length === 0) {
                    area.innerHTML = `<div class="p-8 text-center bg-white rounded-xl text-gray-500 shadow-sm border border-gray-100">এই অধ্যায়ের কোনো ${emptyMsg} এখনো আপলোড করা হয়নি।</div>`;
                } else {
                    area.innerHTML = `<div class="grid gap-4 md:grid-cols-2">` + materials.map(m => `
                        <a href="${m.link}" target="_blank" class="flex items-center p-4 bg-white rounded-xl shadow-sm hover:shadow-md border border-gray-100 transition group">
                            <div class="bg-emerald-100 text-primary w-12 h-12 rounded-lg flex items-center justify-center text-xl shrink-0 group-hover:scale-110 transition"><i class="fa-solid fa-file-pdf"></i></div>
                            <div class="ml-4">
                                <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">${m.type === 'QuestionBank' ? 'Q-Bank' : 'Notes'}</span>
                                <h3 class="font-bold text-gray-800 leading-tight">${m.title}</h3>
                            </div>
                        </a>
                    `).join('') + `</div>`;
                }
            } 
            else if (tab === 'videos') {
                const videos = (state.data.videos || []).filter(v => v.chapter === chName);
                if(videos.length === 0) area.innerHTML = `<div class="p-8 text-center bg-white rounded-xl text-gray-500 shadow-sm border border-gray-100">এই অধ্যায়ের কোনো ভিডিও ক্লাস উপলব্ধ নেই।</div>`;
                else {
                    area.innerHTML = `<div class="grid gap-4 md:grid-cols-2">` + videos.map(v => {
                        let ytId = '';
                        try { ytId = v.link.split('v=')[1]?.split('&')[0] || v.link.split('youtu.be/')[1]?.split('?')[0]; } catch(e){}
                        const thumb = ytId ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg` : 'https://placehold.co/320x180/064e3b/ffffff?text=Video+Class';
                        
                        return `
                        <a href="${v.link}" target="_blank" class="block bg-white rounded-xl overflow-hidden shadow-sm hover:shadow-lg transition border border-gray-100">
                            <div class="relative">
                                <img src="${thumb}" class="w-full h-40 object-cover" alt="Video">
                                <div class="absolute inset-0 bg-black/20 flex items-center justify-center group-hover:bg-black/10 transition">
                                    <i class="fa-brands fa-youtube text-4xl text-white drop-shadow-md"></i>
                                </div>
                            </div>
                            <div class="p-4">
                                <h3 class="font-bold text-gray-800 line-clamp-2">${v.title}</h3>
                            </div>
                        </a>
                    `}).join('') + `</div>`;
                }
            }
            else if (tab === 'mcq') {
                renderMCQ(area, chName);
            }
        }

        function renderMCQ(container, chName) {
            const mcqs = (state.data.practiceTests || []).filter(q => q.chapter === chName);
            
            if(mcqs.length === 0) {
                container.innerHTML = `<div class="p-8 text-center bg-white rounded-xl text-gray-500 shadow-sm border border-gray-100">এই অধ্যায়ের কোনো প্র্যাকটিস প্রশ্ন নেই।</div>`;
                return;
            }

            state.score = 0;
            let html = `
                <div class="bg-white rounded-xl shadow-sm p-4 mb-4 flex justify-between items-center sticky top-0 z-10 border-b">
                    <span class="font-bold text-gray-700">মোট প্রশ্ন: ${toBengaliNum(mcqs.length)}টি</span>
                    <span class="font-bold text-primary bg-emerald-50 px-4 py-2 rounded-lg">স্কোর: <span id="mcq-score">০</span></span>
                </div>
                <div class="space-y-6">
            `;

            mcqs.forEach((q, i) => {
                html += `
                    <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100" id="q-card-${i}">
                        <h3 class="font-bold text-gray-800 mb-4 text-lg"><span class="text-primary mr-2">${toBengaliNum(i+1)}.</span> ${q.q}</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3" id="q-opts-${i}">
                            <button onclick="checkAns(this, 'optA', '${q.ans}', ${i})" class="mcq-btn text-left p-3 border rounded-lg hover:bg-gray-50 transition">ক) ${q.optA}</button>
                            <button onclick="checkAns(this, 'optB', '${q.ans}', ${i})" class="mcq-btn text-left p-3 border rounded-lg hover:bg-gray-50 transition">খ) ${q.optB}</button>
                            <button onclick="checkAns(this, 'optC', '${q.ans}', ${i})" class="mcq-btn text-left p-3 border rounded-lg hover:bg-gray-50 transition">গ) ${q.optC}</button>
                            <button onclick="checkAns(this, 'optD', '${q.ans}', ${i})" class="mcq-btn text-left p-3 border rounded-lg hover:bg-gray-50 transition">ঘ) ${q.optD}</button>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        function checkAns(btnElement, selectedOpt, correctOpt, qIndex) {
            const container = document.getElementById(`q-opts-${qIndex}`);
            const btns = container.querySelectorAll('.mcq-btn');
            
            btns.forEach(b => {
                b.disabled = true;
                b.classList.remove('hover:bg-gray-50');
                b.classList.add('cursor-not-allowed', 'opacity-80');
            });

            const optMap = ['optA', 'optB', 'optC', 'optD'];
            
            if (selectedOpt === correctOpt) {
                btnElement.classList.add('bg-green-500', 'text-white', 'border-green-600', 'font-bold');
                state.score++;
                document.getElementById('mcq-score').innerText = toBengaliNum(state.score);
            } else {
                btnElement.classList.add('bg-red-500', 'text-white', 'border-red-600');
                const correctIdx = optMap.indexOf(correctOpt);
                if(correctIdx !== -1) {
                    btns[correctIdx].classList.add('bg-green-500', 'text-white', 'border-green-600', 'font-bold');
                }
            }
        }

                html = `
                    <h2 class="text-2xl font-bold mb-4">গ্লোবাল মক টেস্ট যোগ করুন</h2>
                    <form onsubmit="handleAdminSubmit(event, 'add_mock_test')" class="bg-white p-5 rounded-lg shadow-sm border border-gray-100 mb-6 space-y-4">
                        <div><label class="block text-sm font-bold mb-1">পরীক্ষার নাম/শিরোনাম</label><input type="text" name="title" required class="w-full border rounded p-2 focus:outline-blue-500"></div>
                        <div><label class="block text-sm font-bold mb-1">লিংক (Google Form / Any Tool)</label><input type="url" name="link" required class="w-full border rounded p-2 focus:outline-blue-500"></div>
                        <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded font-bold hover:bg-blue-600 transition">যোগ করুন</button>
                    </form>
                    <ul class="space-y-2">
                        ${mockTests.map(m => `<li class="bg-white p-3 rounded shadow-sm flex justify-between items-center border-l-4 border-blue-500"><span><b>${m.title}</b></span> <a href="${m.link}" target="_blank" class="text-xs bg-gray-200 px-2 py-1 rounded hover:bg-gray-300">Open <i class="fa-solid fa-external-link-alt"></i></a></li>`).join('')}
                    </ul>
                `;
            }
            else if (tabId === 'practiceTests') {
                const practiceTests = state.data.practiceTests || [];
                html = `
                    <h2 class="text-2xl font-bold mb-4">প্র্যাকটিস MCQ যোগ করুন</h2>
                    <form onsubmit="handleAdminSubmit(event, 'add_practice_test')" class="bg-white p-5 rounded-lg shadow-sm border border-gray-100 mb-6 space-y-4">
                        <div><label class="block text-sm font-bold mb-1">অধ্যায়</label><select name="chapter" class="w-full border rounded p-2 focus:outline-purple-500">${chOptions}</select></div>
                        <div><label class="block text-sm font-bold mb-1">প্রশ্ন</label><textarea name="q" required class="w-full border rounded p-2 focus:outline-purple-500" rows="2"></textarea></div>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="text-xs font-bold">ক) Option A</label><input type="text" name="optA" required class="w-full border rounded p-1 focus:outline-purple-500"></div>
                            <div><label class="text-xs font-bold">খ) Option B</label><input type="text" name="optB" required class="w-full border rounded p-1 focus:outline-purple-500"></div>
                            <div><label class="text-xs font-bold">গ) Option C</label><input type="text" name="optC" required class="w-full border rounded p-1 focus:outline-purple-500"></div>
                            <div><label class="text-xs font-bold">ঘ) Option D</label><input type="text" name="optD" required class="w-full border rounded p-1 focus:outline-purple-500"></div>
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-1">সঠিক উত্তর নির্বাচন করুন</label>
                            <select name="ans" class="w-full border rounded p-2 bg-green-50 font-bold focus:outline-purple-500">
                                <option value="optA">ক) Option A</option>
                                <option value="optB">খ) Option B</option>
                                <option value="optC">গ) Option C</option>
                                <option value="optD">ঘ) Option D</option>
                            </select>
                        </div>
                        <button type="submit" class="bg-purple-600 text-white px-4 py-2 rounded font-bold hover:bg-purple-700 transition">যোগ করুন</button>
                    </form>
                    <div class="bg-white rounded-lg border border-gray-100 p-4 shadow-sm text-sm">
                        <b>সর্বমোট সংরক্ষিত প্রশ্ন: ${practiceTests.length} টি</b>
                    </div>
                `;
            }

            main.innerHTML = html;
        }

        async function handleAdminSubmit(e, action) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            
            showSpinner(true);
            const success = await fetchAPI(action, data);
            
            if (success) {
                showToast('সফলভাবে যুক্ত করা হয়েছে!');
                e.target.reset();
                await initData(); 
                
                const currentTabMap = {
                    'add_material': 'materials',
                    'add_video': 'videos',
                    'add_mock_test': 'mockTests',
                    'add_practice_test': 'practiceTests'
                };
                renderAdminContent(currentTabMap[action]);
            } else {
                showToast('সংরক্ষণ করতে সমস্যা হয়েছে!', 'error');
            }
            showSpinner(false);
        }

        // ==========================================
        // INITIALIZE APP ON LOAD
        // ==========================================
        window.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
